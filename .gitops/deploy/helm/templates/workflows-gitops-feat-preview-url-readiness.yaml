  source:
    path: .gitops/deploy/helm
    repoURL: https://github.com/hops-ops/workflows-gitops.git
    targetRevision: feat/preview-url-readiness
    helm:
      version: v3
      values: |
        env:
          test: true
          type: preview
          method: promotion
          event: push
        image:
          tag: feat-preview-url-readiness-ce9697c409c38fad337caa13a17de2254579da86
  destination:
    namespace: workflows-gitops-feat-preview-url-readiness
    server: https://kubernetes.default.svc
